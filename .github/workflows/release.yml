name: 🚀 CI & Automated Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nom du tag (ex: v2.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-check:
    name: 🧪 Build Check (Windows)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐹 Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 🔨 Test Windows Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -v ./src

  release:
    name: 📦 Package & Publish Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐹 Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 🔍 Determine Release Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building release for tag: $TAG"

      - name: 🔨 Build Windows Executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          TAG="${{ steps.version.outputs.tag }}"
          go build -o "dist/Aethelgard_${TAG}.exe" ./src
          cp "dist/Aethelgard_${TAG}.exe" dist/Aethelgard.exe

      - name: 📦 Package Complete Game Bundle (Windows + Audio)
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          BUNDLE_DIR="Aethelgard_${TAG}_Windows_Complete"
          mkdir -p "$BUNDLE_DIR"
          
          cp dist/Aethelgard.exe "$BUNDLE_DIR/"
          cp README.md "$BUNDLE_DIR/" || true
          cp LICENSE "$BUNDLE_DIR/" || true
          
          if [ -d "voix" ]; then
            cp -r voix "$BUNDLE_DIR/"
          fi
          
          zip -r "dist/Aethelgard_${TAG}_Windows_Complete.zip" "$BUNDLE_DIR"
          rm -rf "$BUNDLE_DIR"

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 🏰 AETHELGARD ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/Aethelgard_${{ steps.version.outputs.tag }}.exe
            dist/Aethelgard.exe
            dist/Aethelgard_${{ steps.version.outputs.tag }}_Windows_Complete.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
